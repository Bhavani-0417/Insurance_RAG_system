name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Check for committed bytecode
        run: |
          if find . -type f \( -name "*.pyc" -o -name "*.pyo" \) | grep -q .; then
            echo "Compiled Python files must not be committed."
            exit 1
          fi
